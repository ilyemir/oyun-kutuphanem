<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Ekle - Oyun Kütüphanem</title>
    <link rel="stylesheet" href="css/stil.css">
</head>
<body>
    <header>
        <h1>Oyun Kütüphanem</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="kutuphane.html">Kütüphane</a>
            <a href="oyun-ekle.html" class="aktif">Oyun Ekle</a>
            <a href="hakkinda.html">Hakkında</a>
            <button type="button" id="temaButonu" class="tema-butonu">Açık Tema</button>
        </nav>
    </header>

    <main>
        <section class="bolum-kutu">
            <h2>Yeni Oyun Ekle</h2>
            <form id="oyunEkleForm">
                <label for="oyunBaslik">Oyun Adı (Listeden seçiniz veya yazınız):</label>
                <input type="text" id="oyunBaslik" list="oyunListesi" placeholder="Örn: Cyberpunk 2077" autocomplete="off" required>
                <datalist id="oyunListesi"></datalist>
                
                <label for="oyunKategori">Kategori / Tür:</label>
                <input type="text" id="oyunKategori" placeholder="Örn: RPG, Aksiyon" required>

                <label for="oyunDurum">Oynama Durumu:</label>
                <select id="oyunDurum">
                    <option value="Oynanıyor">Oynanıyor</option>
                    <option value="Bitti">Bitti</option>
                    <option value="İstek Listesi">İstek Listesi</option>
                </select>

                <label for="oyunPuan">Puanınız (1-10):</label>
                <input type="number" id="oyunPuan" min="1" max="10" placeholder="8">

                <label for="oyunNot">Kısa Not (İsteğe bağlı):</label>
                <textarea id="oyunNot" rows="3" placeholder="Oyun hakkındaki düşüncelerinizi veya ilerleme notunuzu yazabilirsiniz..."></textarea>

                <button type="submit">Oyunu Kaydet</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Oyun Kütüphanem &middot; BLM2537</p>
    </footer>

    <script src="js/oyun-verisi.js"></script>
    <script src="js/uygulama.js"></script>
    <script>
        const oyunGirdisi = document.getElementById('oyunBaslik');
        const kategoriGirdisi = document.getElementById('oyunKategori');
        const veriListesi = document.getElementById('oyunListesi');

        document.addEventListener('DOMContentLoaded', function() {
            OYUN_KATALOGU.forEach(oyun => {
                const secenek = document.createElement('option');
                secenek.value = oyun.ad;
                veriListesi.appendChild(secenek);
            });
        });

        oyunGirdisi.addEventListener('input', function() {
            const girilenDeger = oyunGirdisi.value.trim().toLowerCase();
            const eslesenOyun = OYUN_KATALOGU.find(oyun => oyun.ad.toLowerCase() === girilenDeger);
            
            if (eslesenOyun) {
                kategoriGirdisi.value = eslesenOyun.tur;
            }
        });

        document.getElementById('oyunEkleForm').addEventListener('submit', function(olay) {
            olay.preventDefault();

            const baslik = oyunGirdisi.value.trim();
            const kategori = kategoriGirdisi.value.trim();
            const durum = document.getElementById('oyunDurum').value;
            const puan = document.getElementById('oyunPuan').value;
            const not = document.getElementById('oyunNot').value.trim();

            oyunEkle(baslik, kategori, durum, puan, not);

            alert('Oyun kütüphaneye eklendi.');
            window.location.href = 'kutuphane.html';
        });
    </script>
</body>
</html>
