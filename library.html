<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kütüphanem - Oyun Kütüphanem</title>
    <link rel="stylesheet" href="css/stil.css">
</head>
<body>
    <header>
        <h1>Oyun Kütüphanem</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="library.html">Kütüphane</a>
            <a href="add-game.html">Oyun Ekle</a>
            <a href="about.html">Hakkında</a>
        </nav>
    </header>

    <main>
        <h2>Oyun Arşivi</h2>

        <div class="library-toolbar">
            <input type="text" id="aramaKutusu" placeholder="Oyun adı veya türe göre ara..." oninput="oyunlariFiltrele()">
            <select id="durumFiltresi" onchange="oyunlariFiltrele()">
                <option value="hepsi">Tüm Durumlar</option>
                <option value="Oynanıyor">Oynanıyor</option>
                <option value="Bitti">Bitti</option>
                <option value="İstek Listesi">İstek Listesi</option>
            </select>
        </div>
        
        <div id="oyunKapsayici" class="game-list-container"></div>
    </main>

    <footer>
        <p>&copy; 2026 Oyun Kütüphanem</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        function durumSinifiGetir(durum) {
            if (durum === 'Oynanıyor') return 'status-playing';
            if (durum === 'Bitti') return 'status-completed';
            if (durum === 'İstek Listesi') return 'status-wishlist';
            return '';
        }

        function oyunlariEkranaBas(liste) {
            const kapsayici = document.getElementById('oyunKapsayici');
            const oyunlar = liste || oyunlariGetir();

            kapsayici.innerHTML = '';

            if (oyunlar.length === 0) {
                kapsayici.innerHTML = '<p style="padding: 20px 0;">Aradığın kriterlere uygun oyun bulunamadı.</p>';
                return;
            }

            oyunlar.forEach(oyun => {
                const satir = document.createElement('div');
                const durumSinifi = durumSinifiGetir(oyun.durum);
                satir.className = `game-row ${durumSinifi}`;

                satir.innerHTML = `
                    <div class="game-info">
                        <div class="game-title-group">
                            <h3>${oyun.baslik}</h3>
                            <p>${oyun.kategori}</p>
                        </div>
                    </div>
                    
                    <div class="game-actions">
                        <span class="rating-tag">${oyun.puan}/10</span>
                        <select class="status-select" onchange="durumDegistir(${oyun.id}, this.value)">
                            <option value="Oynanıyor" ${oyun.durum === 'Oynanıyor' ? 'selected' : ''}>Oynanıyor</option>
                            <option value="Bitti" ${oyun.durum === 'Bitti' ? 'selected' : ''}>Bitti</option>
                            <option value="İstek Listesi" ${oyun.durum === 'İstek Listesi' ? 'selected' : ''}>İstek Listesi</option>
                        </select>
                        <button class="delete-btn" onclick="oyunSilmeIslemi(${oyun.id})">Sil</button>
                    </div>
                `;

                kapsayici.appendChild(satir);
            });
        }

        function oyunlariFiltrele() {
            const arananMetin = document.getElementById('aramaKutusu').value.toLowerCase();
            const secilenDurum = document.getElementById('durumFiltresi').value;
            const tumOyunlar = oyunlariGetir();

            const filtrelenmis = tumOyunlar.filter(oyun => {
                const baslikEslesti = oyun.baslik.toLowerCase().includes(arananMetin) || oyun.kategori.toLowerCase().includes(arananMetin);
                const durumEslesti = secilenDurum === 'hepsi' || oyun.durum === secilenDurum;
                
                return baslikEslesti && durumEslesti;
            });

            oyunlariEkranaBas(filtrelenmis);
        }

        function oyunSilmeIslemi(id) {
            if (confirm('Bu oyunu silmek istediğine emin misin?')) {
                oyunSil(id);
                oyunlariFiltrele();
            }
        }

        function durumDegistir(id, yeniDurum) {
            oyunDurumGuncelle(id, yeniDurum);
            oyunlariFiltrele();
        }

        document.addEventListener('DOMContentLoaded', () => oyunlariEkranaBas());
    </script>
</body>
</html>
