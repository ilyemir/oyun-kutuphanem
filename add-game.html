<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Ekle - Oyun Kütüphanem</title>
    <link rel="stylesheet" href="css/stil.css">
</head>
<body>
    <header>
        <h1>Oyun Kütüphanem</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="library.html">Kütüphane</a>
            <a href="add-game.html">Oyun Ekle</a>
            <a href="about.html">Hakkında</a>
        </nav>
    </header>

    <main>
        <h2>Yeni Oyun Ekle</h2>
        <form id="oyunEkleForm">
            <label for="oyunBaslik">Oyun Adı:</label>
            <input type="text" id="oyunBaslik" placeholder="Örn: Cyberpunk 2077" required>
            
            <label for="oyunKategori">Kategori / Tür:</label>
            <input type="text" id="oyunKategori" placeholder="Örn: RPG, Aksiyon" required>

            <label for="oyunDurum">Oynama Durumu:</label>
            <select id="oyunDurum">
                <option value="Oynanıyor">Oynanıyor</option>
                <option value="Bitti">Bitti</option>
                <option value="İstek Listesi">İstek Listesi</option>
            </select>

            <label for="oyunPuan">Puanım (1-10):</label>
            <input type="number" id="oyunPuan" min="1" max="10" placeholder="8">

            <button type="submit">Oyunu Kaydet</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Oyun Kütüphanem</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('oyunEkleForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const baslik = document.getElementById('oyunBaslik').value;
            const kategori = document.getElementById('oyunKategori').value;
            const durum = document.getElementById('oyunDurum').value;
            const puan = document.getElementById('oyunPuan').value;

            oyunEkle(baslik, kategori, durum, puan);

            alert('Oyun kütüphaneye eklendi!');
            window.location.href = 'library.html';
        });
    </script>
</body>
</html>
